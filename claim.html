<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SKM 2026 Claim Verification | Off Ground Events</title>
  <link rel="icon" href="favicon.ico">
  <style>
    :root { --ink:#10233d; --blue:#0d67b5; --line:#cfe0f2; --pale:#f4f9ff; --red:#981f2b; --green:#08734a; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--pale); color:var(--ink); font-family:Arial,Helvetica,sans-serif; }
    header { padding:16px 20px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
    .logo { width:48px; height:48px; display:grid; place-items:center; background:var(--ink); color:#fff; border-radius:7px; font-weight:900; }
    main { width:min(900px,calc(100% - 24px)); margin:24px auto; }
    .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:20px; margin-bottom:16px; }
    h1,h2,h3 { margin-top:0; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    label { display:block; font-weight:800; margin-bottom:6px; }
    input { width:100%; min-height:48px; border:1px solid #a9bfd8; border-radius:7px; padding:10px 12px; font:inherit; }
    button,.button { display:inline-flex; min-height:44px; align-items:center; justify-content:center; border:0; border-radius:7px; padding:10px 15px; background:var(--blue); color:#fff; font-weight:850; text-decoration:none; cursor:pointer; }
    button.secondary { background:#fff; color:var(--ink); border:1px solid var(--line); }
    button.danger { background:var(--red); }
    .actions { display:flex; flex-wrap:wrap; gap:9px; margin-top:14px; }
    .status { display:none; padding:12px; border-radius:7px; margin-top:12px; font-weight:700; }
    .status.visible { display:block; }
    .status.error { background:#ffe0e4; color:#7e1521; border:1px solid #ef9ea8; }
    .status.success { background:#dff8eb; color:#075c3a; border:1px solid #91d9ba; }
    .status.warning { background:#fff2c7; color:#664800; border:1px solid #e7c867; }
    .hidden { display:none !important; }
    .details { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .detail { border:1px solid var(--line); border-radius:7px; padding:11px; }
    .detail strong { display:block; font-size:12px; color:#52677c; margin-bottom:4px; }
    table { width:100%; border-collapse:collapse; margin-top:10px; }
    th,td { padding:10px; border-bottom:1px solid var(--line); text-align:left; }
    .release-banner { padding:15px; border:2px solid var(--green); color:var(--green); background:#ecfff6; font-size:18px; font-weight:900; margin:14px 0; }
    .hold-banner { padding:15px; border:2px solid var(--red); color:var(--red); background:#fff0f2; font-size:18px; font-weight:900; margin:14px 0; }
    @media(max-width:650px){ .grid,.details{grid-template-columns:1fr;} main{margin:12px auto;} .card{padding:15px;} }
  </style>
</head>
<body>
  <header><div class="logo">OG</div><div><strong>Off Ground Events</strong><br><span>SKM 2026 Fulfillment Verification</span></div></header>
  <main>
    <section class="card" id="loginCard">
      <h1>Authorized Staff Login</h1>
      <p>This QR contains no runner information. Sign in with an assigned fulfillment, verifier, or owner account to open the record.</p>
      <form id="loginForm" class="grid">
        <div><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
        <div><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
        <div><button type="submit">Sign In And Verify</button></div>
      </form>
      <div class="status" id="loginStatus"></div>
    </section>

    <section class="card hidden" id="lookupCard">
      <h2>Scan Or Manual Lookup</h2>
      <div class="grid"><div><label for="lookup">QR token or registration reference</label><input id="lookup" autocomplete="off"></div></div>
      <div class="actions"><button type="button" id="lookupBtn">Open Runner Record</button><button type="button" class="secondary" id="signOutBtn">Sign Out</button></div>
      <div class="status" id="lookupStatus"></div>
    </section>

    <section class="card hidden" id="resultCard"></section>
  </main>
  <script>
    const SUPABASE_URL = "https://uzaxlsezfnwnlntehdwe.supabase.co";
    const SUPABASE_KEY = "sb_publishable_5Sq553e_tVnLA0PDUtai4w_ZN7fx1bB";
    const state = { token: localStorage.getItem("skm_admin_token") || "", refresh: localStorage.getItem("skm_admin_refresh") || "", role:"", record:null };
    const loginCard = document.getElementById("loginCard");
    const lookupCard = document.getElementById("lookupCard");
    const resultCard = document.getElementById("resultCard");
    const lookupInput = document.getElementById("lookup");

    function escapeHtml(value){ return String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;"); }
    function setStatus(id,message,type=""){ const el=document.getElementById(id); el.textContent=message; el.className=`status visible ${type}`; }
    function clearStatus(id){ document.getElementById(id).className="status"; }
    function pretty(value){ return String(value || "-").replaceAll("_"," ").replace(/\b\w/g,(c)=>c.toUpperCase()); }

    async function request(path, options={}){
      const response=await fetch(`${SUPABASE_URL}${path}`,{...options,headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${state.token}`,"Content-Type":"application/json",...(options.headers||{})}});
      const text=await response.text(); let data=null; try{data=text?JSON.parse(text):null;}catch{data={message:text};}
      if(!response.ok) throw new Error(data?.message||data?.error_description||"Request failed.");
      return data;
    }

    async function verifySession(){
      if(!state.token) return false;
      try{
        const profile=await request("/rest/v1/rpc/get_my_admin_profile",{method:"POST",body:"{}"});
        state.role=profile?.[0]?.role||"";
        if(!["owner","verifier","fulfillment_staff"].includes(state.role)) throw new Error("This account cannot access fulfillment scans.");
        loginCard.classList.add("hidden"); lookupCard.classList.remove("hidden");
        return true;
      }catch{ return false; }
    }

    async function login(event){
      event.preventDefault(); setStatus("loginStatus","Signing in...");
      try{
        const response=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value})});
        const data=await response.json().catch(()=>null); if(!response.ok) throw new Error(data?.error_description||"Invalid login credentials.");
        state.token=data.access_token; state.refresh=data.refresh_token; localStorage.setItem("skm_admin_token",state.token); localStorage.setItem("skm_admin_refresh",state.refresh);
        if(!await verifySession()) throw new Error("This account is not assigned to fulfillment.");
        clearStatus("loginStatus"); await lookupRecord();
      }catch(error){ setStatus("loginStatus",error.message,"error"); }
    }

    async function lookupRecord(){
      const value=lookupInput.value.trim(); if(!value) return;
      setStatus("lookupStatus","Opening secure fulfillment record..."); resultCard.classList.add("hidden");
      try{
        let lookupValue=value; try{const scannedUrl=new URL(value);lookupValue=scannedUrl.searchParams.get("token")||value;}catch(_){}
        const token=/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(lookupValue)?lookupValue:null;
        state.record=await request("/rest/v1/rpc/admin_lookup_fulfillment",{method:"POST",body:JSON.stringify({p_token:token,p_reference_number:token?null:lookupValue})});
        renderRecord(); clearStatus("lookupStatus");
      }catch(error){ setStatus("lookupStatus",error.message,"error"); }
    }

    function renderRecord(){
      const item=state.record; if(!item)return;
      const released=item.released_at?`<div class="release-banner">ALREADY RELEASED<br><small>${new Date(item.released_at).toLocaleString()} | ${escapeHtml(item.released_at_city||item.claiming_city)} | ${escapeHtml(item.released_by||"")}</small></div>`:"";
      const hold=item.claim_on_hold?`<div class="hold-banner">CLAIM STUB ON HOLD<br><small>${escapeHtml(item.hold_reason||"Contact an authorized administrator.")}</small></div>`:"";
      resultCard.innerHTML=`<h2>${escapeHtml(item.runner_name)}</h2>${released}${hold}<div class="details"><div class="detail"><strong>Reference</strong>${escapeHtml(item.reference_number)}</div><div class="detail"><strong>Bib</strong>${escapeHtml(item.bib_number||"-")}</div><div class="detail"><strong>Category</strong>${escapeHtml(item.race_category)}</div><div class="detail"><strong>Claiming City / Mode</strong>${escapeHtml(item.claiming_city)}</div><div class="detail"><strong>Claim Stub</strong>${item.claim_stub_issued_at?"Issued":"Not issued"}</div><div class="detail"><strong>Release Status</strong>${escapeHtml(pretty(item.status))}</div></div><h3>Confirmed Entitlements</h3><table><thead><tr><th>Item</th><th>Size</th><th>Qty</th></tr></thead><tbody>${(item.items||[]).map((product)=>`<tr><td>${escapeHtml(product.item_name)}</td><td>${escapeHtml(product.variant||"-")}</td><td>${Number(product.quantity||1)}</td></tr>`).join("")}</tbody></table>${releaseControls(item)}`;
      resultCard.classList.remove("hidden");
    }

    function releaseControls(item){
      if(item.category_type!=="physical") return '<div class="status visible warning">Virtual-runner packages are handled through shipment, not race kit claiming.</div>';
      if(item.released_at) return "";
      const normalReady=item.status==="ready_for_release"&&!item.claim_on_hold;
      const warning=item.claim_on_hold
        ? '<div class="status visible error">Release is blocked while this QR is on hold.</div>'
        : item.status!=="ready_for_release"?'<div class="status visible warning">This package is not yet marked Ready for Release.</div>':"";
      const overrideAllowed=["owner","verifier"].includes(state.role);
      return `${warning}<div class="card" style="margin-top:16px;background:#f4f9ff;"><label><input id="idChecked" type="checkbox" style="width:auto;min-height:auto;"> Valid government-issued ID checked and all listed items confirmed</label><div class="actions">${normalReady?'<button type="button" id="releaseBtn">Release Race Kit</button>':""}${overrideAllowed?'<button type="button" class="danger" id="overrideBtn">Authorized Override</button>':""}</div><div class="status" id="releaseStatus"></div></div>`;
    }

    async function release(override=false){
      if(!state.record)return; const checked=document.getElementById("idChecked")?.checked;
      if(!checked){setStatus("releaseStatus","Check the valid-ID and listed-items confirmation first.","error");return;}
      let note=""; if(override){note=window.prompt("Required override reason:","")||"";if(!note.trim())return;}
      if(!window.confirm(override?"Use authorized override and release this race kit?":"Confirm final race kit release?"))return;
      try{
        await request("/rest/v1/rpc/admin_fulfillment_action",{method:"POST",body:JSON.stringify({p_package_id:state.record.id,p_action:override?"release_override":"release",p_note:note.trim(),p_metadata:{id_verified:Boolean(checked),claiming_city:state.record.claiming_city}})});
        await lookupRecord();
      }catch(error){setStatus("releaseStatus",error.message,"error");}
    }

    document.getElementById("loginForm").addEventListener("submit",login);
    document.getElementById("lookupBtn").addEventListener("click",lookupRecord);
    lookupInput.addEventListener("keydown",(event)=>{if(event.key==="Enter"){event.preventDefault();lookupRecord();}});
    document.getElementById("signOutBtn").addEventListener("click",()=>{localStorage.removeItem("skm_admin_token");localStorage.removeItem("skm_admin_refresh");location.reload();});
    resultCard.addEventListener("click",(event)=>{if(event.target.id==="releaseBtn")release(false);if(event.target.id==="overrideBtn")release(true);});

    const params=new URLSearchParams(location.search); lookupInput.value=params.get("token")||"";
    verifySession().then((ok)=>{if(ok&&lookupInput.value)lookupRecord();});
  </script>
</body>
</html>
