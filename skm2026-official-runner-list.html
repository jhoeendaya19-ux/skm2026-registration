<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08274b">
  <meta name="description" content="Official runner list and bib numbers for the Sorsogon Kasanggayahan Marathon 2026.">
  <title>Official Runner List | SKM 2026</title>
  <style>
    :root{
      --navy:#08274b;--blue:#0b5fa5;--gold:#f4c542;--ink:#142338;--muted:#5e7084;
      --line:#d7e4ef;--soft:#f4f8fc;--white:#fff;--danger:#96272f;--danger-soft:#fff0f1;
    }
    *{box-sizing:border-box}
    html{background:var(--soft)}
    body{margin:0;min-width:320px;background:var(--soft);color:var(--ink);font-family:Arial,Helvetica,sans-serif;letter-spacing:0}
    button,input{font:inherit;letter-spacing:0}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible{outline:3px solid rgba(11,95,165,.2);outline-offset:2px}
    .topbar{background:var(--navy);color:#fff;border-bottom:5px solid var(--gold)}
    .topbar-inner{width:min(1040px,100%);min-height:82px;margin:auto;padding:13px 20px;display:flex;align-items:center;gap:14px}
    .event-logo{width:56px;height:56px;flex:0 0 56px;object-fit:contain;border-radius:6px;background:#fff;padding:3px}
    .brand h1{margin:0;font-size:22px;line-height:1.1}
    .brand p{margin:5px 0 0;color:#d5e5f5;font-size:13px}
    main{width:min(1040px,100%);margin:auto;padding:34px 18px 54px}
    .intro{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:0 2px 24px}
    .eyebrow{margin:0 0 8px;color:var(--blue);font-size:12px;font-weight:900;text-transform:uppercase}
    .intro h2{margin:0;color:var(--navy);font-size:38px;line-height:1.08}
    .intro-copy{max-width:620px;margin:11px 0 0;color:var(--muted);font-size:15px;line-height:1.55}
    .total{display:none}
    .total span{display:block;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase}
    .total strong{display:block;margin-top:3px;color:var(--navy);font-size:31px;font-variant-numeric:tabular-nums}
    .total small{display:block;margin-top:2px;color:var(--muted);font-size:11px}
    .controls{padding:15px;background:#fff;border:1px solid var(--line);border-radius:7px 7px 0 0}
    .search-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px}
    .filter-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
    .search-wrap{position:relative}
    .search-wrap label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    .search-icon{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
    input[type="search"],select{width:100%;height:46px;border:1px solid #b9cada;border-radius:6px;background:#fff;color:var(--ink);padding:0 14px}
    input[type="search"]{padding-left:42px}
    input[type="search"]:focus,select:focus{border-color:var(--blue)}
    .filter-field label{display:block;margin:0 0 6px;color:var(--navy);font-size:10px;font-weight:900;text-transform:uppercase}
    .refresh{height:46px;border:1px solid #a9bfd3;border-radius:6px;background:#fff;color:var(--navy);padding:0 16px;font-weight:800}
    .refresh:hover{border-color:var(--blue);background:#eef6fd}.refresh:disabled{opacity:.55;cursor:wait}
    .clear{height:46px;border:0;border-radius:6px;background:var(--navy);color:#fff;padding:0 16px;font-weight:800}.clear:hover{background:#0d3968}.clear:disabled{opacity:.55;cursor:not-allowed}
    .list-shell{overflow:hidden;border:1px solid var(--line);border-top:0;border-radius:0 0 7px 7px;background:#fff}
    .list-head,.runner-row{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:18px;align-items:center}
    .list-head{min-height:43px;padding:0 22px;background:#eaf3fa;color:#405970;font-size:11px;font-weight:900;text-transform:uppercase}
    .list-head span:last-child{text-align:right}
    .runner-row{min-height:61px;padding:11px 22px;border-top:1px solid #e5edf4}
    .runner-row:hover{background:#f8fbfe}
    .runner-name{min-width:0;color:var(--navy);font-size:15px;font-weight:800;line-height:1.35;overflow-wrap:anywhere}
    .bib{justify-self:end;min-width:96px;padding:7px 10px;border-radius:5px;background:var(--navy);color:#fff;text-align:center;font-size:14px;font-weight:900;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
    .loading,.empty{padding:68px 20px;text-align:center;color:var(--muted);font-size:14px}
    .loading-spinner{width:30px;height:30px;margin:0 auto 12px;border:3px solid #d7e4ef;border-top-color:var(--blue);border-radius:50%;animation:spin .75s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty strong{display:block;margin-bottom:7px;color:var(--navy);font-size:18px}
    .error{margin:0 0 12px;padding:13px 15px;border:1px solid #efb8bd;border-radius:6px;background:var(--danger-soft);color:var(--danger);font-size:14px}
    .pager{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:62px;padding:10px 14px;border-top:1px solid var(--line);background:#fafcfe}
    .pager-status{color:var(--muted);font-size:12px}
    .pager-actions{display:flex;gap:7px}
    .page-button{min-width:82px;height:38px;border:1px solid #b9cada;border-radius:5px;background:#fff;color:var(--navy);font-weight:800}
    .page-button:hover:not(:disabled){border-color:var(--blue);background:#eef6fd}.page-button:disabled{opacity:.42;cursor:not-allowed}
    .updated{padding:14px 2px 0;color:var(--muted);font-size:12px;text-align:right}
    footer{padding:22px 18px;border-top:1px solid var(--line);color:var(--muted);text-align:center;font-size:12px}
    @media(max-width:640px){
      .topbar-inner{min-height:74px;padding:11px 14px}.event-logo{width:48px;height:48px;flex-basis:48px}.brand h1{font-size:18px}.brand p{font-size:11px}
      main{padding:25px 10px 42px}.intro{display:block;padding:0 4px 19px}.intro h2{font-size:30px}.intro-copy{font-size:14px}.total{margin-top:17px;text-align:left}.total strong{font-size:26px}
      .controls{padding:10px}.search-row{grid-template-columns:1fr}.filter-grid{grid-template-columns:1fr 1fr}.refresh,.clear{width:100%}
      .list-head,.runner-row{grid-template-columns:minmax(0,1fr) 112px;gap:10px}.list-head{padding:0 14px}.runner-row{min-height:60px;padding:10px 14px}.runner-name{font-size:14px}.bib{min-width:86px;font-size:13px}
      .pager{align-items:stretch;flex-direction:column}.pager-status{text-align:center}.pager-actions{display:grid;grid-template-columns:1fr 1fr}.page-button{width:100%}.updated{text-align:center}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <img class="event-logo" src="https://uzaxlsezfnwnlntehdwe.supabase.co/storage/v1/object/public/site-assets/eventLogo/1782701338103-503a7660-ec5e-4515-9459-20388ee5ae57-chatgpt-image-jun-24-2026-02-09-33-pm.png" alt="SKM 2026 event logo">
      <div class="brand"><h1>Sorsogon Kasanggayahan Marathon 2026</h1><p>Official participant directory</p></div>
    </div>
  </header>

  <main>
    <section class="intro" aria-labelledby="pageTitle">
      <div>
        <p class="eyebrow">Race Directory</p>
        <h2 id="pageTitle">Official Runner List</h2>
        <p class="intro-copy">Search the confirmed participant list by runner name or bib number.</p>
      </div>
      <div class="total" aria-live="polite"><span id="totalLabel">Official runners</span><strong id="totalCount">-</strong><small id="totalNote"></small></div>
    </section>

    <div id="errorBox" class="error" role="alert" hidden></div>

    <section aria-label="Official runners">
      <div class="controls">
        <div class="search-row">
          <div class="search-wrap">
            <label for="runnerSearch">Search runner or bib number</label>
            <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
            <input id="runnerSearch" type="search" placeholder="Search name or bib number" autocomplete="off" disabled>
          </div>
          <button class="clear" id="clearFilters" type="button">Clear filters</button>
          <button class="refresh" id="refreshButton" type="button">Refresh list</button>
        </div>
        <div class="filter-grid" aria-label="Runner filters">
          <div class="filter-field"><label for="categoryFilter">Category</label><select id="categoryFilter" disabled><option value="">All categories</option></select></div>
          <div class="filter-field"><label for="sexFilter">Sex</label><select id="sexFilter" disabled><option value="">All</option></select></div>
          <div class="filter-field"><label for="ageGroupFilter">Age group</label><select id="ageGroupFilter" disabled><option value="">All age groups</option></select></div>
          <div class="filter-field"><label for="runnerGroupFilter">Runner group</label><select id="runnerGroupFilter" disabled><option value="">All runners</option></select></div>
        </div>
      </div>

      <div class="list-shell" id="listShell" aria-busy="true">
        <div class="list-head" aria-hidden="true"><span>Name</span><span>Bib Number</span></div>
        <div id="runnerRows"><div class="loading"><div class="loading-spinner"></div>Loading official runners...</div></div>
        <div class="pager" id="pager" hidden>
          <span class="pager-status" id="pagerStatus"></span>
          <div class="pager-actions">
            <button class="page-button" id="previousPage" type="button">Previous</button>
            <button class="page-button" id="nextPage" type="button">Next</button>
          </div>
        </div>
      </div>
      <div class="updated" id="updatedAt" aria-live="polite"></div>
    </section>
  </main>

  <footer>Official runner list &middot; Sorsogon Kasanggayahan Marathon 2026</footer>

  <script>
    const SUPABASE_URL = "https://uzaxlsezfnwnlntehdwe.supabase.co";
    const SUPABASE_KEY = "sb_publishable_5Sq553e_tVnLA0PDUtai4w_ZN7fx1bB";
    const PAGE_SIZE = 100;
    const state = { runners: [], filtered: [], page: 1, generatedAt: null, loading: false, total: 0, requestId: 0 };
    const filterIds = ["categoryFilter", "sexFilter", "ageGroupFilter", "runnerGroupFilter"];
    const $ = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[character]));
    const normalize = (value) => String(value ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();

    function formatUpdated(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return `List updated ${date.toLocaleString("en-PH", { timeZone: "Asia/Manila", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}`;
    }

    function render() {
      const total = state.filtered.length;
      const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      state.page = Math.min(state.page, pages);
      const start = (state.page - 1) * PAGE_SIZE;
      const visible = state.filtered.slice(start, start + PAGE_SIZE);

      if (!visible.length) {
        $("runnerRows").innerHTML = `<div class="empty"><strong>No runner found</strong>Check the spelling or try a bib number.</div>`;
      } else {
        $("runnerRows").innerHTML = visible.map((runner) => `<div class="runner-row"><span class="runner-name">${escapeHtml(runner.name)}</span><span class="bib">${escapeHtml(runner.bib_number)}</span></div>`).join("");
      }

      $("pager").hidden = !total;
      $("pagerStatus").textContent = total ? `Showing ${start + 1}-${Math.min(start + PAGE_SIZE, total)}` : "";
      $("previousPage").disabled = state.page <= 1;
      $("nextPage").disabled = state.page >= pages;
    }

    function applySearch() {
      const query = normalize($("runnerSearch").value);
      state.filtered = query
        ? state.runners.filter((runner) => normalize(`${runner.name} ${runner.bib_number}`).includes(query))
        : state.runners.slice();
      state.page = 1;
      render();
    }

    function setOptions(id, values, emptyLabel) {
      const select = $(id);
      const current = select.value;
      select.innerHTML = `<option value="">${escapeHtml(emptyLabel)}</option>` + (Array.isArray(values) ? values : []).map((value) => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join("");
      if ([...select.options].some((option) => option.value === current)) select.value = current;
    }

    function renderFilterOptions(filters) {
      setOptions("categoryFilter", filters?.categories, "All categories");
      setOptions("sexFilter", filters?.sexes, "All");
      setOptions("ageGroupFilter", filters?.age_groups, "All age groups");
      setOptions("runnerGroupFilter", filters?.runner_groups, "All runners");
      filterIds.forEach((id) => { $(id).disabled = false; });
    }

    function activeFilters() {
      return {
        p_category: $("categoryFilter").value || null,
        p_sex: $("sexFilter").value || null,
        p_age_group: $("ageGroupFilter").value || null,
        p_runner_group: $("runnerGroupFilter").value || null
      };
    }

    function hasFilters() {
      return filterIds.some((id) => $(id).value);
    }

    async function loadRunners() {
      const requestId = ++state.requestId;
      state.loading = true;
      $("listShell").setAttribute("aria-busy", "true");
      $("refreshButton").disabled = true;
      $("refreshButton").textContent = "Refreshing...";
      $("errorBox").hidden = true;
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/skm2026_public_runner_list`, {
          method: "POST",
          headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
          body: JSON.stringify(activeFilters()),
          cache: "no-store"
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || "The official runner list is temporarily unavailable.");
        if (requestId !== state.requestId) return;
        state.runners = Array.isArray(data.runners) ? data.runners : [];
        state.runners.sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), "en", { sensitivity: "base", numeric: true }));
        state.filtered = state.runners.slice();
        state.generatedAt = data.generated_at || new Date().toISOString();
        state.total = Number(data.total || state.runners.length);
        state.page = 1;
        $("totalLabel").textContent = hasFilters() ? "Matching runners" : "Official runners";
        $("totalCount").textContent = Number(data.filtered_total ?? state.runners.length).toLocaleString();
        $("totalNote").textContent = hasFilters() ? `of ${state.total.toLocaleString()} total` : "";
        $("updatedAt").textContent = formatUpdated(state.generatedAt);
        $("runnerSearch").disabled = false;
        renderFilterOptions(data.filters || {});
        $("clearFilters").disabled = !hasFilters();
        applySearch();
      } catch (error) {
        if (requestId !== state.requestId) return;
        $("errorBox").textContent = error.message;
        $("errorBox").hidden = false;
        $("runnerRows").innerHTML = `<div class="empty"><strong>Unable to load the list</strong>Please refresh the page in a moment.</div>`;
        $("pager").hidden = true;
        $("totalCount").textContent = "-";
      } finally {
        if (requestId !== state.requestId) return;
        state.loading = false;
        $("listShell").setAttribute("aria-busy", "false");
        $("refreshButton").disabled = false;
        $("refreshButton").textContent = "Refresh list";
      }
    }

    $("runnerSearch").addEventListener("input", applySearch);
    $("refreshButton").addEventListener("click", loadRunners);
    filterIds.forEach((id) => $(id).addEventListener("change", loadRunners));
    $("clearFilters").addEventListener("click", () => {
      filterIds.forEach((id) => { $(id).value = ""; });
      $("runnerSearch").value = "";
      loadRunners();
    });
    $("previousPage").addEventListener("click", () => { if (state.page > 1) { state.page -= 1; render(); window.scrollTo({ top: 220, behavior: "smooth" }); } });
    $("nextPage").addEventListener("click", () => { if (state.page * PAGE_SIZE < state.filtered.length) { state.page += 1; render(); window.scrollTo({ top: 220, behavior: "smooth" }); } });
    document.addEventListener("visibilitychange", () => { if (!document.hidden && state.generatedAt && Date.now() - new Date(state.generatedAt).getTime() > 300000) loadRunners(); });
    loadRunners();
  </script>
</body>
</html>
